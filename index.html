<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Aluminum Head | Mars Ticket</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron&display=swap');

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #3b0b0b, #090000);
    font-family: 'Orbitron', sans-serif;
    color: #ff6f3c;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 420px;
    background: rgba(20, 5, 5, 0.9);
    border: 1px solid #ff3d00;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 0 25px rgba(255, 61, 0, 0.6);
}

h1 {
    text-align: center;
    color: #ff3d00;
    text-shadow: 0 0 10px #ff5722;
}

h3 {
    text-align: center;
    color: #ffa07a;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: #120000;
    border: 1px solid #ff5722;
    color: #fff;
    border-radius: 6px;
    font-size: 14px;
}

input::placeholder {
    color: #ff8a65;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #ff3d00, #ff9100);
    border: none;
    border-radius: 6px;
    color: #000;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 10px #ff5722;
}

button:hover {
    box-shadow: 0 0 20px #ff9100;
}

.success {
    margin-top: 15px;
    text-align: center;
    color: #00ffcc;
    text-shadow: 0 0 8px #00ffd5;
}

ul {
    margin-top: 10px;
    padding: 0;
    list-style: none;
}

li {
    background: rgba(255, 61, 0, 0.15);
    border-left: 3px solid #ff3d00;
    margin: 6px 0;
    padding: 8px;
    border-radius: 4px;
    color: #fff;
}
.footer {
    text-align: center;
    margin-top: 15px;
    font-size: 12px;
    color: #ff8a65;
}
</style>
</head>

<body>
<div class="container">
    <h1>🛸 ALUMINUM HEAD 🛸</h1>
    <h3>Mars Concert Ticket System</h3>

    <input type="text" id="fname" placeholder="ชื่อ">
    <input type="text" id="lname" placeholder="นามสกุล">
    <input type="text" id="sid" placeholder="เลขประจำตัวนักเรียน">

    <button onclick="bookTicket()">ACTIVATE TICKET</button>

    <div class="success" id="msg"></div>

    <h3>👨‍🚀 ผู้ได้รับสิทธิ์</h3>
    <ul id="list"></ul>

    <div class="footer">Mars Colony • Limited 10 Humans</div>
</div>

<script>
let users = [];

function bookTicket() {
    if (users.length >= 10) {
        alert("❌ สิทธิ์เต็มแล้ว (10 คน)");
        return;
    }

    let fname = document.getElementById("fname").value.trim();
    let lname = document.getElementById("lname").value.trim();
    let sid = document.getElementById("sid").value.trim();

    if (!fname || !lname || !sid) {
        alert("⚠️ กรุณากรอกข้อมูลให้ครบ");
        return;
    }

    let fullName = fname + " " + lname;
    users.push(fullName);

    document.getElementById("msg").innerText =
        "🎉 ยินดีด้วยคุณกดบัตรคอนเสิร์ตสำเร็จ 🎉";

    let li = document.createElement("li");
    li.innerText = fullName;
    document.getElementById("list").appendChild(li);

    document.getElementById("fname").value = "";
    document.getElementById("lname").value = "";
    document.getElementById("sid").value = "";
}
</script>
</body>
</html>
